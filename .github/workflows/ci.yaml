name: CI

on:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-slim
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    - name: Setup Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.25.x'
    - name: Check workflows
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  release:
    name: Release?
    needs: [verify]
    permissions:
      contents: write
      pull-requests: write
    uses: unfunco/meta/.github/workflows/release-please.yaml@b40ef8e1b220c86892199cb32e2d65d392e74e34 # v0.4.1
