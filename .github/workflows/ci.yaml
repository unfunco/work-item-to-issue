name: CI

on:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-slim
    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.2
    - name: Setup Go
      uses: actions/setup-go@v6.0.0
      with:
        go-version: '1.25.x'
    - name: Check workflows
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  release:
    name: Release?
    needs: [verify]
    permissions:
      contents: write
      pull-requests: write
    uses: unfunco/meta/.github/workflows/release-please.yaml@8a2e3873c609d86b9a67b353a9111bd44171240d # v0.3.0
