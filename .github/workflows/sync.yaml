name: Sync Azure DevOps to GitHub

on:
  workflow_dispatch: { }

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.
      with:
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-devops-url: https://dev.azure.com/honestempire
        azure-devops-project: website
        azure-devops-label: "copilot:ready"
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
