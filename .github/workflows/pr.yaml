name: PR

on:
  pull_request: { }

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-slim
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    - name: Setup Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.25.x'
    - name: Check workflows
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
